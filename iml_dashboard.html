<!DOCTYPE html>
<title>Plant 3 PA IML Board</title>
<style>
/* Layout concept: TV wall-board. One full-width row per work center,
   split into NOW / ON DECK / THEN segments (current run + next two),
   large type throughout so it reads from across the floor. Deliberately
   single light theme. */
:root{
  --bg:#F5F4F1;
  --surface:#FFFFFF;
  --surface-2:#F0EEE8;
  --border:#DDDAD2;
  --fg:#1D1B18;
  --fg-muted:#6B6760;
  --accent:#0079C1;
  --accent-ink:#00588C;
  --good:#177A45;
  --good-bg:#E3F3E9;
  --idle:#B15E12;
  --idle-bg:#FBEBDC;
  --stale:#B0362A;
  --stale-bg:#FAE6E3;
  --state-blue:#0079C1;
  --state-blue-bg:#E1F0FA;
  --state-yellow:#8A6D00;
  --state-yellow-bg:#FFF4C9;
  --state-red:#B0362A;
  --state-red-bg:#FAE6E3;
  --state-black:#17140F;
  --state-black-bg:#E8E6DF;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  padding-inline:28px;
  padding-block:22px 36px;
}
.wrap{max-width:1720px;margin:0 auto}
.num{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-size:34px;font-weight:650;margin:0;letter-spacing:-0.01em}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 4px}
.freshness{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--fg-muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--good);flex:none}
.freshness.stale .dot{background:var(--stale)}
.freshness.idle-fresh .dot{background:var(--idle)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:baseline;gap:12px}
.kpi .v{font-size:34px;font-weight:700}
.kpi .l{font-size:15px;color:var(--fg-muted)}

.columns{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
.column{min-width:0}
.group-title{font-size:17px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 10px;padding-top:6px;border-top:1px solid var(--border)}

.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;
  grid-template-columns:88px 1fr 1fr 1fr;
  align-items:stretch;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  min-width:0;
}
.wc-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-right:1px solid var(--border)}
.wc{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;line-height:1}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.pill.running{background:var(--good-bg);color:var(--good)}
.pill.idle{background:var(--idle-bg);color:var(--idle)}
.pill.blue{background:var(--state-blue-bg);color:var(--state-blue)}
.pill.yellow{background:var(--state-yellow-bg);color:var(--state-yellow)}
.pill.red{background:var(--state-red-bg);color:var(--state-red)}
.pill.black{background:var(--state-black-bg);color:var(--state-black)}
.pill.cav{font-size:9.5px}

.half{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 16px;min-width:0}
.half.next,.half.then{background:var(--surface-2)}
.half.then{border-left:1px solid var(--border)}
.half-text{min-width:0}
.half-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:2px}
.item-desc{font-size:18px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-no{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--fg-muted);margin-top:1px}
.time{font-size:14px;color:var(--fg-muted);margin-top:2px}
.cph{text-align:right;white-space:nowrap}
.cph .n{font-size:30px;font-weight:700;color:var(--accent-ink)}
.cph .u{display:block;font-size:10.5px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.03em}
.empty-note{font-size:16px;color:var(--fg-muted);font-style:italic}

footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;font-size:12px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em}

@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .wc-cell{flex-direction:row;border-right:none;border-bottom:1px solid var(--border);justify-content:flex-start;padding:8px 14px}
  .half{padding:10px 14px}
  .item-desc{white-space:normal}
}
</style>

function fmtCph(v){
  return (v === null || v === undefined) ? '—' : v.toFixed(1);
}

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

// Pill state: compares live cycle time (curr_cycle_time) against the
// standard cycle time (cycle_time) for the job currently running.
// A work center with no live curr_cycle_time reading at all is treated
// as down — IQMS only reports a live cycle time while the machine is
// actually cycling, so missing/null/zero means it isn't running.
//   No job scheduled at all                    -> Idle (gray)
//   curr_cycle_time missing or <= 0             -> Down (yellow)
//   curr_cycle_time == cycle_time (tolerance)   -> Running (blue)
//   curr_cycle_time <  cycle_time (faster)      -> Running Fast (black)
//   curr_cycle_time >  cycle_time (slower)      -> Running Slow (red)
function pillState(wc){
  if(!wc.cur) return {cls:'idle', text:'Idle'};

  const curr = wc.cur.curr_cycle_time;
  const std = wc.cur.cycle_time;

  if(curr === null || curr === undefined || curr <= 0){
    return {cls:'yellow', text:'Down'}; // no live cycle reading — machine is down
  }
  if(std === null || std === undefined){
    return {cls:'blue', text:'Running'}; // live reading but no standard to compare against
  }

  const tolerance = 0.05; // seconds, absorbs float/rounding noise
  if(Math.abs(curr - std) <= tolerance) return {cls:'blue', text:'Running'};
  if(curr < std) return {cls:'black', text:'Running Fast'}; // lower cycle time = faster than standard
  return {cls:'red', text:'Running Slow'}; // higher cycle time = slower than standard
}

// Cavitation state: Cavitation % (ACT_CAV / STD_CAV from the table,
// stored as a 0–1 fraction where 1.0 = 100%) banded into three tiers.
//   No job / no reading       -> not shown
//   cavitation >= 95%         -> Running (blue)
//   cavitation >= 85% (<95%)  -> Caution (yellow)
//   cavitation <  85%         -> Low (red)
function cavitationState(wc){
  if(!wc.cur) return null;
  const cav = wc.cur.cavitation;
  if(cav === null || cav === undefined) return null; // no reading yet — nothing to show

  if(cav >= 0.95) return {cls:'blue', text:'Running'};
  if(cav >= 0.85) return {cls:'yellow', text:'Caution'};
  return {cls:'red', text:'Low'};
}

function renderRow(wc){
  const {cls: pillCls, text: pillText} = pillState(wc);
  const cavState = cavitationState(wc);
  const cavPill = cavState ? `<span class="pill cav ${cavState.cls}">${Math.round(wc.cur.cavitation*100)}% CAV</span>` : '';

  const nowHalf = wc.cur ? `
      <div class="half-text">
        <div class="half-label">Running now</div>
        <div class="item-desc" title="${wc.cur.desc}">${wc.cur.desc}</div>
        <div class="item-no">${wc.cur.item}</div>
        <div class="time num">${fmtTime(wc.cur.start)} – ${fmtTime(wc.cur.end)}</div>
      </div>
      <div class="cph"><span class="n num">${fmtCph(wc.cur.cph)}</span><span class="u">ctn / hr</span></div>
    ` : `<div class="half-text"><div class="half-label">Running now</div><div class="empty-note">No job running</div></div><div></div>`;

  const nextHalf = wc.nxt ? `
      <div class="half-text">
        <div class="half-label">On deck</div>
        <div class="item-desc" title="${wc.nxt.desc}">${wc.nxt.desc}</div>
        <div class="item-no">${wc.nxt.item}</div>
        <div class="time num">starts ${fmtTime(wc.nxt.start)}</div>
      </div>
      <div class="cph"><span class="n num">${fmtCph(wc.nxt.cph)}</span><span class="u">ctn / hr</span></div>
    ` : `<div class="half-text"><div class="half-label">On deck</div><div class="empty-note">Nothing scheduled next</div></div><div></div>`;

  const thenHalf = wc.nxt2 ? `
      <div class="half-text">
        <div class="half-label">Then</div>
        <div class="item-desc" title="${wc.nxt2.desc}">${wc.nxt2.desc}</div>
        <div class="item-no">${wc.nxt2.item}</div>
        <div class="time num">starts ${fmtTime(wc.nxt2.start)}</div>
      </div>
      <div class="cph"><span class="n num">${fmtCph(wc.nxt2.cph)}</span><span class="u">ctn / hr</span></div>
    ` : `<div class="half-text"><div class="half-label">Then</div><div class="empty-note">Nothing scheduled after that</div></div><div></div>`;

  return `<div class="row">
    <div class="wc-cell">
      <span class="wc">${wc.wc}</span>
      <span class="pill ${pillCls}">${pillText}</span>
      ${cavPill}
    </div>
    <div class="half now">${nowHalf}</div>
    <div class="half next">${nextHalf}</div>
    <div class="half then">${thenHalf}</div>
  </div>`;
}

function render(data){
  const wcs = (data.work_centers || []).filter(w => w.mfg === "PA IML");
  // "Running" = actually cycling right now (blue/red/black pill). Everything
  // else — no job scheduled, or a job scheduled but not reporting a live
  // cycle (yellow "Down") — counts as down for this tile.
  const running = wcs.filter(w => ['blue','red','black'].includes(pillState(w).cls)).length;
  const down = wcs.length - running;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><span class="v num">${wcs.length}</span><span class="l">Work centers</span></div>
    <div class="kpi"><span class="v num" style="color:var(--good)">${running}</span><span class="l">Running now</span></div>
    <div class="kpi"><span class="v num" style="color:var(--idle)">${down}</span><span class="l">Down</span></div>
  `;

  const groups = {};
  wcs.forEach(w => { (groups[w.mfg] = groups[w.mfg] || []).push(w); });
  const order = Object.keys(groups).sort((a,b)=> (a==='MEASUREX'?-1:1) - (b==='MEASUREX'?-1:1) || a.localeCompare(b));

  document.getElementById('groups').innerHTML = order.map(g => `
    <div class="column">
      <div class="group-title">${g}</div>
      <div class="rows">${groups[g].sort((a,b)=>a.wc.localeCompare(b.wc)).map(renderRow).join('')}</div>
    </div>
  `).join('');

  const exportedAt = new Date(data.exported_at);
  const ageMin = (Date.now() - exportedAt.getTime()) / 60000;
  const fEl = document.getElementById('freshness');
  const fText = document.getElementById('freshness-text');
  const stamp = exportedAt.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  if(ageMin > 30){
    fEl.className = 'freshness stale';
    fText.textContent = `Data as of ${stamp} — refresh appears stopped`;
  } else if (ageMin > 15){
    fEl.className = 'freshness idle-fresh';
    fText.textContent = `Data as of ${stamp} — running a bit behind`;
  } else {
    fEl.className = 'freshness';
    fText.textContent = `Updated ${stamp}`;
  }
}

render(DATA);
</script>
